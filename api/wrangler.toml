name = "vk-ig-gallery"
main = "ig-gallery-worker.js"
compatibility_date = "2026-10-01"

# ต่ออายุ Instagram token ทุกวันจันทร์ 03:00 UTC
[triggers]
crons = ["0 3 * * 1"]

[vars]
# ใส่โดเมนเว็บจริงเมื่อ deploy แล้ว (คั่นหลายโดเมนด้วย ,) — "*" = อนุญาตทุกที่
ALLOWED_ORIGIN = "https://diewland-portfolio.vasin.workers.dev,https://diewland3012.github.io,http://localhost:5500,http://localhost:5501"

# จำกัด /admin ไม่เกิน 30 ครั้งต่อนาทีต่อ IP (กันเดารหัสผ่าน)
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Cloudflare Images — ย่อรูป IG เป็น WebP (/thumb/<id>?w=600|1600) ฟรี 5,000 ครั้ง/เดือน
[images]
binding = "IMAGES"

# สร้าง KV ด้วย: npx wrangler kv namespace create IG_KV  แล้วเอา id มาใส่
[[kv_namespaces]]
binding = "IG_KV"
id = "6b33faa4389e49789e478a8178a2fc76"
